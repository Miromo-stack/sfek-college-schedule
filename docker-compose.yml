version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sfek-postgres
    environment:
      POSTGRES_DB: sfek_schedule
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: sfek-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sfek_schedule?schema=public
      JWT_SECRET: super-secret-jwt-key-change-in-production
      JWT_REFRESH_SECRET: super-refresh-secret-key-change-in-production
      PORT: '3001'
      NODE_ENV: production
      CORS_ORIGIN: http://localhost
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: sfek-frontend
    ports:
      - '80:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
